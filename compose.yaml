services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rainbow}
      POSTGRES_USER: ${POSTGRES_USER:-rainbow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rainbow-local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rainbow} -d ${POSTGRES_DB:-rainbow}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres-data:
