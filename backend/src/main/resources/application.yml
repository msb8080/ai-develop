spring:
  application:
    name: rainbow-ai-develop
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rainbow}
    username: ${DATABASE_USERNAME:rainbow}
    password: ${DATABASE_PASSWORD:rainbow-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  ai:
    model:
      embedding: none
      image: none
    openai:
      base-url: ${AI_BASE_URL:http://localhost:11434}
      api-key: ${AI_API_KEY:local-not-configured}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          max-completion-tokens: ${AI_MAX_COMPLETION_TOKENS:4096}
    mcp:
      server:
        enabled: ${MCP_ENABLED:false}
        name: rainbow-ai-develop
        version: 0.1.0
        protocol: STATELESS

server:
  port: ${APP_PORT:8080}
  shutdown: graceful

rainbow:
  ai:
    workspace:
      root: ${AI_WORKSPACE_ROOT:..}
      max-files: ${AI_CONTEXT_MAX_FILES:20}
      max-file-chars: ${AI_CONTEXT_MAX_FILE_CHARS:3500}
      max-total-chars: ${AI_CONTEXT_MAX_TOTAL_CHARS:16000}
    chat:
      enabled: ${AI_ENABLED:false}
      provider: ${AI_PROVIDER:none}
      model: ${AI_MODEL:none}
      stream-mode: ${AI_STREAM_MODE:native}
      sse-timeout: ${AI_SSE_TIMEOUT:2m}
    sandbox:
      enabled: ${SANDBOX_ENABLED:true}
      docker-binary: ${SANDBOX_DOCKER_BINARY:docker}
      image: ${SANDBOX_IMAGE:maven:3.9-eclipse-temurin-17}
      maven-repository: ${SANDBOX_MAVEN_REPOSITORY:}
      timeout: ${SANDBOX_TIMEOUT:3m}
      memory: ${SANDBOX_MEMORY:768m}
      cpus: ${SANDBOX_CPUS:1}
      pids-limit: ${SANDBOX_PIDS_LIMIT:128}
      max-output-characters: ${SANDBOX_MAX_OUTPUT_CHARACTERS:12000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  level:
    root: INFO
    dev.rainbow.aidevelop: INFO
